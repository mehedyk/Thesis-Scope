hor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1">Low / Medium / High</text><text x="1070" y="196" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#cbd5e1">with “why” boxes</text>
